<!doctype html>
<!-- ============================================================
     TOEIC 학습 앱 (앱 본체)
     ⚠ 버전은 data/list.js 의 APP_VERSION 과 sw.js 의 CACHE 로 관리한다.
        문제를 추가하든 이 파일을 고치든, 바뀔 때마다 두 값을 같은 날짜-버전으로 올릴 것.
     문제 데이터는 data/T1.js, data/T2.js … (TEST 별 파일), 목록은 data/list.js
     ============================================================ -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEIC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png">
<title>TOEIC</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f2f4f6; --line:#e5e8eb; --line2:#d1d6db;
  --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --faint:#c3c9d0;
  --blue:#3182f6; --blue-soft:#e8f3ff; --blue-head:#1b6fd6;
  --red:#f04452; --red-soft:#ffeeee; --yellow:#ffc94a; --green:#03b26c;
  --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17171c; --bg2:#0e0e12; --line:#2c2c35; --line2:#3a3a45;
    --ink:#f2f4f6; --sub:#b0b8c1; --muted:#8b95a1; --faint:#4e5968;
    --blue:#4d96ff; --blue-soft:#1b2a44; --blue-head:#1a4f9c;
    --red:#ff6b76; --red-soft:#3a1f23; --yellow:#f4c04a; --green:#2fd08d;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{max-width:600px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top .bar{height:56px;display:flex;align-items:center;justify-content:center;position:relative}
.top .ttl{font-size:18px;font-weight:700;letter-spacing:-.3px}
.top .back{position:absolute;left:8px;top:0;height:56px;width:48px;display:grid;place-items:center}
.top .back svg{width:26px;height:26px}
.top .act{position:absolute;right:16px;top:0;height:56px;display:flex;align-items:center;font-size:14px;color:var(--muted)}
.top.blue{background:var(--blue-head);color:#fff}
.top.blue .act{color:#fff}
.sub{background:var(--bg2);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.sub .lbl{flex:1;text-align:center;color:var(--sub);font-size:16px;font-weight:500;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .nav{width:44px;height:44px;display:grid;place-items:center;color:var(--sub)}
.sub .nav[disabled]{visibility:hidden}
.sub .nav svg{width:22px;height:22px}

#view{padding:0 0 calc(110px + env(safe-area-inset-bottom))}
.pad{padding:0 20px}

/* 하단 고정 버튼 */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.bottom .in{max-width:560px;margin:0 auto;display:flex;gap:12px}
.btn{flex:1;height:56px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--bg);color:var(--ink);font-weight:600}
.btn.ghost svg{width:20px;height:20px}

/* 홈 */
.hero{padding:22px 20px 6px}
.hero .date{color:var(--muted);font-size:14px;margin:0 0 4px}
.hero h1{margin:0;font-size:28px;letter-spacing:-.5px;font-weight:800}
.today{margin:16px 20px 6px;border-radius:18px;background:var(--blue);color:#fff;padding:20px;display:block;width:calc(100% - 40px);text-align:left}
.today .k{font-size:13px;opacity:.85}
.today .t{font-size:20px;font-weight:700;margin:4px 0 12px;letter-spacing:-.3px}
.today .row{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.today .go{background:rgba(255,255,255,.2);border-radius:10px;padding:8px 12px;font-weight:700}
.today .pg{height:6px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.today .pg i{display:block;height:100%;background:#fff;border-radius:6px}
.sh{font-size:13px;font-weight:700;color:var(--muted);padding:26px 20px 8px;letter-spacing:.2px}
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li .ic{width:42px;height:42px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:19px;flex:none}
.li .ic.p{font-size:13px;font-weight:800;color:var(--blue);background:var(--blue-soft)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px}
.li .tx span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.li .rt{font-size:13px;color:var(--muted);flex:none}
.li .rt.done{color:var(--blue);font-weight:700}
.li .chev{color:var(--faint);flex:none}
.li .chev svg{width:18px;height:18px}

/* 문제 */
.qbox{padding:30px 20px 0}
.qmeta{font-size:13px;color:var(--muted);margin:0 0 8px}
.stem{font-size:21px;font-weight:700;line-height:1.42;letter-spacing:-.3px;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.stem .no{position:relative;display:inline-block;margin-right:6px}
.stem .no::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.stem .no.ok::after{border:3px solid var(--blue)}
.stem .no.ng::before{content:"";position:absolute;left:50%;top:50%;width:52px;height:3px;background:var(--red);transform:translate(-50%,-50%) rotate(-55deg);border-radius:3px}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);margin:0 4px;transform:translateY(-4px)}
.ans{font-size:19px;font-weight:700;margin:26px 0 0}
.ans em{font-style:normal;color:var(--blue)}
.ans em.ng{color:var(--red)}
.choices{display:grid;gap:14px;margin:26px 0 0}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:18px 18px;font-size:18px;line-height:1.4;background:var(--bg);transition:background .12s,border-color .12s}
.ch .l{flex:none}
.ch.sel{background:var(--blue-soft);border-color:#a9cdfb;color:var(--blue)}
.ch.right{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:700}
.ch.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.ch.dim{color:var(--faint)}
.done .ch{cursor:default}

/* 지문 */
.passage{margin:22px 20px 0;border:1px solid var(--line);border-radius:14px;background:var(--bg2);padding:16px 16px 18px}
.passage .pt{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 10px}
.passage .px{font-size:15.5px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ptitle{margin:18px 20px 0;font-size:13px;font-weight:700;color:var(--muted)}
.passage+.passage{margin-top:12px}
.gtabs{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:15;display:flex;background:var(--bg);border-bottom:1px solid var(--line)}
.gtabs button{flex:1;height:50px;font-size:16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.gtabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.gtabs button small{font-size:13px;font-weight:600;margin-left:4px}
.ctx{margin:14px 0 0;background:var(--bg2);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.65;color:var(--sub);word-break:keep-all;overflow-wrap:anywhere}
.golink{display:block;margin:22px 20px 0;height:52px;width:calc(100% - 40px);border-radius:14px;border:1.5px solid var(--blue);color:var(--blue);font-size:16px;font-weight:700}
.pb{display:inline-block;min-width:52px;text-align:center;border-bottom:2px solid var(--sub);font-size:12px;font-weight:700;color:var(--muted);padding:0 4px;margin:0 2px}
.pb.on{color:var(--blue);border-color:var(--blue);background:var(--blue-soft);border-radius:4px 4px 0 0}

/* 해설 */
.gap{height:16px;background:var(--bg2);margin:30px 0 0}
.sec{padding:26px 20px;border-bottom:1px solid var(--line);margin:0 20px;padding-left:0;padding-right:0}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 14px;font-size:19px;font-weight:700}
.sec p{margin:0;font-size:17px;line-height:1.62;color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.sec .tag{display:block;margin:0 0 4px;font-size:17px}
details.pk{margin-top:14px;border-radius:12px;background:var(--bg2);padding:12px 14px}
details.pk summary{font-size:14px;color:var(--sub);font-weight:600;cursor:pointer}
details.pk p{font-size:15px;margin-top:10px}
.voc{display:flex;align-items:center;gap:10px;padding:4px 0}
.voc .w{font-size:17px}
.voc .m{font-size:17px;color:var(--ink)}
.voc .bm{margin-left:auto;flex:none}
.mini{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}
.mini svg{width:14px;height:14px}
.mini.on{background:var(--yellow)}

/* 단어장 */
.tabs{display:flex;align-items:center;gap:18px;padding:18px 20px 6px;white-space:nowrap}
.tabs .tb{font-size:17px;color:var(--muted);font-weight:500}
.tabs .tb.on{color:var(--blue);font-weight:600}
.tabs .bmonly{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub);white-space:nowrap}
.tabs .bmonly .mini{width:28px;height:28px}
@media (max-width:360px){.tabs{gap:12px;padding-left:16px;padding-right:16px}.tabs .tb{font-size:15.5px}.tabs .bmonly{font-size:13px}}
.info{margin:12px 20px 4px;background:var(--bg2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.6}
.wrow{display:flex;align-items:center;gap:18px;padding:20px 20px;border-bottom:1px solid var(--line)}
.wrow .big{width:52px;height:52px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff;flex:none}
.wrow .big svg{width:20px;height:20px}
.wrow .big.on{background:var(--yellow)}
.wrow .body{flex:1;min-width:0}
.wrow .p1{font-size:21px;font-weight:600;letter-spacing:-.2px;word-break:keep-all}
.wrow .p1.k{font-size:19px;font-weight:700}
.wrow .p2{font-size:17px;color:var(--sub);margin-top:8px;word-break:keep-all}
.wrow .hid{margin-top:10px;height:48px;border:1.5px dashed var(--line2);border-radius:8px;background:var(--bg2);display:grid;place-items:center;color:var(--faint);font-size:18px;width:100%}
.empty{padding:60px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7}

/* 통계 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 20px 0}
.kpi{background:var(--bg2);border-radius:14px;padding:14px 12px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.4px}
.kpi span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.prow{padding:14px 20px;border-bottom:1px solid var(--line)}
.prow .h{display:flex;justify-content:space-between;font-size:15px}
.prow .h span{color:var(--muted);font-size:13.5px}
.bar2{height:8px;border-radius:8px;background:var(--bg2);overflow:hidden;margin-top:9px}
.bar2 i{display:block;height:100%;border-radius:8px;background:var(--blue)}
.week{display:flex;gap:8px;align-items:flex-end;height:96px;padding:14px 20px 0}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .d i{display:block;width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--blue);min-height:3px}
.week .d i.z{background:var(--line)}
.week .d span{font-size:11.5px;color:var(--muted)}
.opt{display:flex;gap:8px;padding:6px 20px 0}
.opt button{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;font-weight:600;color:var(--sub)}
.opt button[data-p]{height:58px;line-height:1.3}
.opt button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.note{padding:10px 20px;font-size:13px;color:var(--muted);line-height:1.6}
.danger{color:var(--red)!important}

/* 확인 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal.show{display:flex}
.modal .box{width:100%;max-width:380px;background:var(--bg);border-radius:28px;padding:30px 22px 22px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.22);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal .msg{font-size:18px;font-weight:600;margin:0 0 22px;line-height:1.5}
.modal .bs{display:flex;gap:10px}
.modal .bs button{flex:1;height:54px;border-radius:27px;background:var(--bg2);font-size:17px;font-weight:600}
.modal .bs button.pri{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(25,31,40,.92);color:#fff;font-size:14px;padding:11px 18px;border-radius:22px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* 비밀번호 잠금 */
.lock{padding:70px 24px 0;text-align:center}
.lock .ic{font-size:44px}
.lock h2{margin:14px 0 8px;font-size:22px;letter-spacing:-.3px}
.lock p{margin:0 0 26px;color:var(--muted);font-size:14.5px;line-height:1.6}
.lock input{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-size:17px;padding:0 16px;outline:none}
.lock input:focus{border-color:var(--blue)}
.lock .err{color:var(--red);font-size:14px;min-height:22px;margin:10px 0 0}
.lock .btn{width:100%;flex:none;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <div class="bar">
      <button class="back" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
      <div class="ttl" id="ttl">TOEIC</div>
      <div class="act" id="act"></div>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="bottom" id="bottom" hidden><div class="in" id="bin"></div></div>
<div class="modal" id="modal"><div class="box"><p class="msg" id="mmsg"></p><div class="bs"><button id="mno">취소</button><button class="pri" id="myes">확인</button></div></div></div>
<div class="toast" id="toast"></div>

<script src="data/list.js"></script>
<script>/* data/list.js 의 DATA_FILES 순서대로 TEST 데이터 파일을 불러온다 */
document.write(DATA_FILES.map(f=>'<script src="data/'+f+'.js?v='+APP_VERSION+'"><\/script>').join(""));</script>
<script>
/* 앱 본체: 아래 '비밀번호 잠금' 스크립트가 문제 데이터를 복호화한 뒤 window.__startApp() 으로 실행한다 */
window.__startApp=function(){
/* =========================================================================
   TOEIC 학습 앱 (RC)  —  데일리 학습 · 파트별 풀이 · 오답 노트 · 단어장 · 통계
   저장: localStorage (키 접두사 "toeic.")  · 로그인/서버 불필요
   -------------------------------------------------------------------------
   DATA.bank 문제 스키마 (TOEIC_SPEC.md 참고)
   { id:"T1-101", test:"TEST 1", part:5, no:101, pid:"지문ID(Part6·7)",
     stem:"문장 ------- 빈칸", choices:["..","..","..",".."], answer:0(0=A),
     ko:"해석", type:"해설 유형", exp:"해설", vocab:[["word","뜻"],...] }
   ========================================================================= */
/* ---------------- 데이터 조립 ----------------
   data/Tn.js 가 window.TOEIC_DATA 에 { key, name, passages, questions, words } 를 push 한다.
   세트(문제 묶음)와 단어장은 여기서 자동으로 만든다:
   - Part 5: 번호순 10문항씩  /  Part 6·7: 지문(pid)별 묶음, 제목은 passage.kind(편지·광고문…)
   - 단어장: TEST 별로 문항 vocab + words(추가 단어)를 중복 없이 모음 */
const DATA=(()=>{
  const raw=(window.TOEIC_DATA||[]).slice().sort((a,b)=>DATA_FILES.indexOf(a.key)-DATA_FILES.indexOf(b.key));
  const D={bank:[],passages:{},tests:[]};
  raw.forEach(t=>{
    const qs=(t.questions||[]).slice().sort((a,b)=>a.no-b.no);
    qs.forEach(q=>{q.test=q.test||t.name;});
    D.bank.push(...qs);Object.assign(D.passages,t.passages||{});
    const parts={};
    [5,6,7].forEach(pn=>{
      const pq=qs.filter(q=>q.part===pn),sets=[];
      if(pn===5){for(let i=0;i<pq.length;i+=10){const g=pq.slice(i,i+10);
          sets.push({sub:`${g[0].no}–${g[g.length-1].no}`,ids:g.map(q=>q.id)});}}
      else{const groups=[];pq.forEach(q=>{const k=q.pid||q.id;let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,qs:[]});g.qs.push(q);});
        groups.forEach(g=>{const ps=t.passages?.[g.k];const f=g.qs[0].no,l=g.qs[g.qs.length-1].no;
          sets.push({sub:`${f===l?f:f+"–"+l}${ps?.kind?" "+ps.kind:""}`,ids:g.qs.map(q=>q.id)});});}
      sets.forEach((x,i)=>{x.id=`${t.key}-P${pn}-${i+1}`;x.part=pn;x.test=t.name;x.tkey=t.key;});
      if(sets.length)parts[pn]=sets;
    });
    const seen=new Set(),words=[];
    [...qs.flatMap(q=>q.vocab||[]),...(t.words||[])].forEach(([w,m])=>{const k=w.toLowerCase();if(!seen.has(k)){seen.add(k);words.push([w,m]);}});
    D.tests.push({key:t.key,name:t.name,ids:qs.map(q=>q.id),parts,words});
  });
  return D;
})();
const TEST=k=>DATA.tests.find(t=>t.key===k);

/* ---------------- 저장소 ---------------- */
const LS={
  get(k,d){try{const v=localStorage.getItem("toeic."+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("toeic."+k,JSON.stringify(v));}catch(e){}},
};
const Q={};DATA.bank.forEach(q=>Q[q.id]=q);
const L="ABCD";
const $=id=>document.getElementById(id);
const view=$("view"),top_=$("top"),ttl=$("ttl"),act=$("act"),back=$("back"),bottom=$("bottom"),bin=$("bin");
const IC={
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  bm:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>',

/* ---------------- 랜덤 풀기 ----------------
   우선순위: [0] 안 푼 문제 + 틀린 문제(마지막 풀이가 오답)  → 무작위로 섞어 먼저
             [1] 맞힌 문제(마지막 풀이가 정답) → 풀이 횟수 적은 순 → 오래전에 푼 순
   Part 6·7은 지문 단위로 묶어서 출제(지문 안 문항 중 가장 급한 문항 기준으로 순위). */
function qTier(id,st){const e=st[id];if(!e||!e.seen)return {t:0,k:"new"};if(e.last!==Q[id].answer)return {t:0,k:"wrong"};return {t:1,k:"ok",seen:e.seen,ts:e.ts||0};}
function randPool(parts){
  const st=LS.get("stats",{}),units={};
  DATA.bank.filter(q=>parts.includes(q.part)).forEach(q=>{const u=q.pid||q.id;(units[u]=units[u]||[]).push(q.id);});
  return Object.values(units).map(ids=>{const ts=ids.map(id=>qTier(id,st));
    const t=Math.min(...ts.map(x=>x.t));const ok=ts.filter(x=>x.t===1);
    return {ids,t,seen:t?Math.min(...ok.map(x=>x.seen)):0,ts:t?Math.min(...ok.map(x=>x.ts)):0,r:Math.random()};});
}
function randOrder(parts,size){
  const u=randPool(parts).sort((a,b)=>a.t-b.t||(a.t?(a.seen-b.seen||a.ts-b.ts):0)||a.r-b.r);
  const out=[];for(const x of u){if(size!=="all"&&out.length>=size)break;out.push(...x.ids);}return out;
}

function blanks(t,on){return esc(t).replace(/\[(\d{3})\]/g,(m,n)=>`<span class="pb ${+n===on?"on":""}">${n}</span>`);}

function quiz(S){
  if(S._pick===undefined)S._pick=null;
  const ids=S.ids;if(!ids.length){frame(S.title);view.innerHTML=`<div class="empty">풀 문제가 없습니다.</div>`;return;}
  if(S.i>=ids.length)S.i=ids.length-1;
  const id=ids[S.i],q=Q[id],a=ansOf(S.key)[id],done=a!=null;
  if((q.part===6||q.part===7)&&q.pid)return quizGroup(S);   // Part 6·7: 지문 단위 일괄 풀이
  frame(S.title);
  const pas=q.pid?DATA.passages[q.pid]:null;
  const stemHtml=esc(q.stem).replace(/-{3,}/g,'<span class="blank"></span>');
  let h=`<div class="sub"><button class="nav" id="pv" ${S.i===0?"disabled":""}>${IC.l}</button>
    <div class="lbl">${esc(S.label)}</div><button class="nav" id="nx" ${S.i===ids.length-1?"disabled":""}>${IC.r}</button></div>`;
  if(pas){
    h+=`<p class="ptitle">${esc(pas.title)}</p>`+passageHtml(pas,q.no);
  }

    <p class="stem"><span class="no ${done?(a===q.answer?"ok":"ng"):""}">${S.i+1}.</span>${stemHtml}</p>`;
  if(done)h+=`<p class="ans">정답 <em>(${L[q.answer]})</em>${a!==q.answer?` <span style="font-size:15px;color:var(--muted);font-weight:500">· 내 답 <em class="ng">(${L[a]})</em></span>`:""}</p>`;
  h+=`<div class="choices">`+q.choices.map((c,k)=>{
    let cls="ch";
    if(done)cls+=k===q.answer?" right":(k===a?" wrong":" dim");else if(S._pick===k)cls+=" sel";
    return `<button class="${cls}" data-k="${k}" ${done?"disabled":""}><span class="l">(${L[k]})</span><span>${esc(c)}</span></button>`;}).join("")+`</div></div>`;

        <button class="bm mini ${bm[w.toLowerCase()]?"on":""}" data-w="${esc(w)}" data-m="${esc(m)}" aria-label="북마크">${IC.bm}</button></div>`).join("")}</div>`;
  }
  view.innerHTML=h;
  $("pv").onclick=()=>{S.i--;S._pick=null;quiz(S);};
  $("nx").onclick=()=>{S.i++;S._pick=null;quiz(S);};
  if(!done){
    view.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{S._pick=+b.dataset.k;
      view.querySelectorAll(".ch").forEach(x=>x.classList.toggle("sel",+x.dataset.k===S._pick));$("submit").disabled=false;});
    setBottom(`<button class="btn" id="submit" ${S._pick==null?"disabled":""}>정답 제출</button>`);
    $("submit").onclick=async()=>{if(S._pick==null)return;

  }else{
    const last=S.i===ids.length-1;
    setBottom(`<button class="btn ghost" id="retry">${IC.re}다시 풀기</button><button class="btn" id="next">${last?"목록으로":"다음 문제"}</button>`);
    $("retry").onclick=()=>{setAns(S.key,id,null);S._pick=null;quiz(S);};
    $("next").onclick=()=>{if(last){back.onclick();}else{S.i++;S._pick=null;quiz(S);}};

<script>
/* =========================================================================

(async()=>{

  const view=document.getElementById("view");
  document.getElementById("back").style.visibility="hidden";
  if(!window.crypto||!crypto.subtle){view.innerHTML=`<div class="empty">이 브라우저에서는 열 수 없어요.<br>(https 주소에서 열어 주세요)</div>`;return;}
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64e=u=>btoa(String.fromCharCode(...u));
  async function derive(pw){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(SALT),iterations:ITER,hash:"SHA-256"},base,256));
  }
  async function open(raw){   // 전부 풀리면 true, 하나라도 실패하면 false(아무것도 넣지 않음)
    try{
      const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]),out=[];
      for(const e of enc)out.push(JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(e.iv)},k,b64d(e.ct)))));
      (window.TOEIC_DATA=window.TOEIC_DATA||[]).push(...out);return true;
    }catch(err){return false;}
  }
  let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved&&await open(b64d(saved)))return window.__startApp();
  view.innerHTML=`<div class="lock"><div class="ic">🔒</div><h2>비밀번호를 입력하세요</h2>
    <p>${saved?"비밀번호가 바뀌었어요. 새 비밀번호를 입력하세요.":"처음 한 번만 입력하면 이 기기에서는<br>다음부터 바로 열립니다."}</p>
    <form id="lk"><input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">
    <div class="err" id="err"></div><button class="btn" id="ok">열기</button></form></div>`;
  const pw=document.getElementById("pw"),err=document.getElementById("err"),ok=document.getElementById("ok");
  setTimeout(()=>pw.focus(),300);
  document.getElementById("lk").onsubmit=async ev=>{
    ev.preventDefault();if(!pw.value)return;
    ok.disabled=true;ok.textContent="확인 중…";err.textContent="";
    const raw=await derive(pw.value);
    if(await open(raw)){try{localStorage.setItem(KEY,b64e(raw));}catch(e){}window.__startApp();}
    else{err.textContent="비밀번호가 맞지 않아요";ok.disabled=false;ok.textContent="열기";pw.select();}
  };
})();
</script>
</body>
</html>
